<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="منصة تعلم اللغات التابعة لكلية اللغات والترجمة بجامعة الأهرام الكندية. Language learning platform of the Faculty of Languages and Translation, Ahram Canadian University."
    />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>منصة ACU للغات</title>
    <!--
      The loading screen. Its styles live here, not in the bundle, so it is on screen before any
      script arrives; the app's own SplashScreen component reuses the same class names.
    -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 4.25rem;
        padding: 1.5rem;
        background: #fff;
        color: #101828;
        font-family: 'Alexandria Variable', 'IBM Plex Sans Arabic', system-ui, sans-serif;
        text-align: center;
      }

      .splash-mark {
        --splash-size: clamp(8.5rem, 30vmin, 11.5rem);

        position: relative;
        inline-size: var(--splash-size);
        block-size: var(--splash-size);
        animation: splash-arrive 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .splash-layer {
        position: absolute;
        inset: 0;
        inline-size: 100%;
        block-size: 100%;
        user-select: none;
      }

      /* The globe stays still and breathes; the ring of blades clicks round it, as in the app. */
      .splash-globe {
        clip-path: circle(26.5%);
        animation: splash-breathe 1.8s ease-in-out infinite;
      }

      .splash-ring {
        mask-image: radial-gradient(circle closest-side, transparent 53%, #000 calc(53% + 0.5px));
        animation: splash-shutter 3.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      /* A hairline orbit carrying one letter from each of the six languages. */
      .splash-orbit {
        position: absolute;
        inset: -2.4rem;
        border: 1px solid #fde3d0;
        border-radius: 50%;
        animation: splash-fade 900ms 200ms ease-out both;
      }

      .splash-orbit span {
        --angle: calc(var(--i) * 60deg);

        position: absolute;
        top: 50%;
        left: 50%;
        display: grid;
        place-items: center;
        inline-size: 2rem;
        block-size: 2rem;
        border-radius: 50%;
        background: #fff;
        color: #98a2b3;
        font-family: system-ui, sans-serif;
        font-size: 1.05rem;
        font-weight: 600;
        line-height: 1;
        transform: translate(-50%, -50%) rotate(var(--angle))
          translateY(calc(-0.5 * var(--splash-size) - 2.4rem)) rotate(calc(-1 * var(--angle)));
        animation: splash-letter 3.6s calc(var(--i) * 0.6s) ease-in-out infinite;
      }

      .splash-text {
        display: grid;
        justify-items: center;
        gap: 0.6rem;
        animation: splash-rise 700ms 150ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .splash-name {
        margin: 0;
        font-size: clamp(1.6rem, 6vmin, 2.25rem);
        font-weight: 700;
        line-height: 1.3;
      }

      /* A short bar that slides under the name: the only sign that something is on its way. */
      .splash-bar {
        position: relative;
        inline-size: 4.5rem;
        block-size: 3px;
        border-radius: 3px;
        background: #fde3d0;
        overflow: hidden;
      }

      .splash-bar::after {
        content: '';
        position: absolute;
        inset-block: 0;
        left: 0;
        inline-size: 45%;
        border-radius: inherit;
        background: #f95a00;
        animation: splash-slide 1.4s ease-in-out infinite alternate;
      }

      .splash-sub {
        margin: 0;
        color: #475467;
        font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
        font-size: 0.95rem;
      }

      @keyframes splash-arrive {
        from {
          opacity: 0;
          scale: 0.9;
        }
      }

      @keyframes splash-rise {
        from {
          opacity: 0;
          translate: 0 0.75rem;
        }
      }

      @keyframes splash-fade {
        from {
          opacity: 0;
        }
      }

      @keyframes splash-breathe {
        50% {
          scale: 0.94;
        }
      }

      @keyframes splash-slide {
        to {
          left: 55%;
        }
      }

      @keyframes splash-letter {
        /* The size is animated, not the scale: a scale would also stretch the letter's orbit. */
        0%,
        22%,
        100% {
          color: #98a2b3;
          font-size: 1.05rem;
        }

        8% {
          color: #f95a00;
          font-size: 1.4rem;
        }
      }

      @keyframes splash-shutter {
        0%,
        4% {
          rotate: 0deg;
        }

        12.5%,
        16.5% {
          rotate: 45deg;
        }

        25%,
        29% {
          rotate: 90deg;
        }

        37.5%,
        41.5% {
          rotate: 135deg;
        }

        50%,
        54% {
          rotate: 180deg;
        }

        62.5%,
        66.5% {
          rotate: 225deg;
        }

        75%,
        79% {
          rotate: 270deg;
        }

        87.5%,
        91.5% {
          rotate: 315deg;
        }

        100% {
          rotate: 360deg;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-mark,
        .splash-text,
        .splash-orbit,
        .splash-globe,
        .splash-ring,
        .splash-orbit span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="جارٍ التحميل">
        <div class="splash-mark">
          <div class="splash-orbit" aria-hidden="true">
            <span style="--i: 0" lang="ar">ع</span>
            <span style="--i: 1">A</span>
            <span style="--i: 2">É</span>
            <span style="--i: 3">Ä</span>
            <span style="--i: 4" lang="zh">中</span>
            <span style="--i: 5" lang="ja">あ</span>
          </div>
          <img class="splash-layer splash-globe" src="/src/assets/brand/emblem.webp" alt="" />
          <img class="splash-layer splash-ring" src="/src/assets/brand/emblem.webp" alt="" />
        </div>
        <div class="splash-text">
          <p class="splash-name">منصة ACU للغات</p>
          <span class="splash-bar"></span>
          <p class="splash-sub">كلية اللغات والترجمة · جامعة الأهرام الكندية</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
